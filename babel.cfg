[python: */**.py]
[jinja2: */**.jinja2]
# OctoPrint registers a custom {% try %}...{% endtry %} tag for templates that
# render plugin-supplied content. Without this extension Jinja2 cannot parse
# klipper_sidebar.jinja2, and Babel silently extracts nothing from that file.
extensions=octoprint.util.jinja.ExceptionHandlerExtension

[javascript: */**.js]
extract_messages = gettext, ngettext

# Vendored third-party bundles are not ours to translate. The minified Monaco
# build in particular produces bogus matches from its inlined regexes.
[ignore: **/lib]
